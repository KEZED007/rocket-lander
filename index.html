<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket Lander</title>
  <style>
    body { background: #05070f; color: #ccc; font-family: sans-serif; text-align: center; margin: 16px; }
    canvas { max-width: 100%; border: 1px solid #333; }
    #world { touch-action: none; } /* on phones, dragging a block shouldn't scroll the page */
    #settings { display: grid; gap: 6px; max-width: 600px; margin: 0 auto 12px; text-align: left; }
    #settings label { display: grid; grid-template-columns: 9.5em 1fr 3em; align-items: center; gap: 8px; font-size: 14px; }
    #settings input { min-width: 0; } /* let sliders shrink instead of pushing the numbers out */
    #settings output { font-family: monospace; text-align: right; }
  </style>
</head>
<body>
  <h1>Rocket Lander</h1>
  <p>↑ engine · A D turn · R restart. Land gently and upright on the green pad.</p>
  <p>Obstacles: click the sky to add a block · drag to move · double-click to remove.</p>
  <p><button id="ai">Let the AI learn</button> <button id="clearBlocks">Clear obstacles</button></p>
  <canvas id="world" width="600" height="400"></canvas>
  <br>
  <canvas id="chart" width="600" height="220" aria-label="Learning curve: average score per 1,000 practice flights"></canvas>
  <h2>Settings</h2>
  <div id="settings"></div>
  <p>
    <label>Rocket colour <input type="color" id="rocketColor" value="#dddddd"></label>
    <button id="defaults">Defaults</button>
    <button id="resetAI">Reset AI</button>
  </p>
  <!-- ?v= makes browsers fetch fresh copies; raise it whenever any .js file changes -->
  <script src="physics.js?v=2"></script>
  <script src="agent.js?v=2"></script>
  <script src="chart.js?v=2"></script>
  <script src="settings.js?v=2"></script>
  <script src="game.js?v=2"></script>
</body>
</html>
